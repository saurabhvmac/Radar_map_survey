[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'No build step needed'"

[functions]
  node_bundler = "esbuild"

# Separate public links for the two surveys (same page, it reads the address)
[[redirects]]
  from = "/"
  to = "/entry"
  status = 301

[[redirects]]
  from = "/entry"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/exit"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex"
